version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 20 && nvm use 20
        - rm -rf node_modules
        - npm install
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
        - node scripts/upload-logo.js
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
